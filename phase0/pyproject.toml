[project]
name = "essaim-phase0"
version = "0.1.0"
description = "Phase 0 du mode B : fusion de modèles de familles différentes"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.6",
  "transformers>=5.0",
  "accelerate>=1.0",
  "huggingface_hub>=0.30",
  "pyarrow>=15",
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[tool.uv]
package = false

# CPU-only PyTorch on Windows/Linux; macOS uses the default PyPI wheel (MPS included).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
gguf = [
    "protobuf>=7.36.2",
    "sentencepiece>=0.2.2",
]
paper = [
    "matplotlib>=3.11.2",
]
scicode = [  # E12: what the SciCode tests import (the official scicode package itself: colab_jobs.SCICODE_PIP)
    "h5py>=3.10",
    "scipy>=1.11",
    "sympy>=1.12",
]
