[project]
name = "myriad"
version = "0.2.1"
description = "Myriad : un LLM décentralisé, un nœud par PC, fusion des réponses de modèles de familles différentes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "websockets>=13.0",
  "pydantic>=2.6",
  "cryptography>=42",
  "huggingface_hub>=0.30",
  "truststore>=0.10.4",
  "certifi>=2026.7.22",
]

[project.optional-dependencies]
# Desktop app (native window + tray icon). Without it, `myriad-desktop` opens the default browser.
desktop = [
  "pywebview>=5.0",
  "pywebview[qt]>=5.0; sys_platform == 'linux'",
  "pystray>=0.19",
  "Pillow>=10.0",
]
# Optional local PII detector (myriad/privacy_model.py): ONNX Runtime on the CPU, no PyTorch.
# Without it the privacy layer falls back to the regex rules only.
pii = [
  "onnxruntime>=1.20",
  "tokenizers>=0.20",
  "numpy>=1.26",
]

[project.scripts]
myriad = "myriad.cli:main"
myriad-desktop = "myriad.desktop:main"
# Deprecated aliases (the package was called essaim before)
essaim = "myriad.cli:main"
essaim-desktop = "myriad.desktop:main"

[project.gui-scripts]
myriad-app = "myriad.desktop:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["myriad"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]
build = [
  "pyinstaller>=6.10",
]
# PII detector benchmark (bench/pii/), never shipped: `uv sync --group pii-bench`.
pii-bench = [
  "onnxruntime>=1.20",
  "tokenizers>=0.20",
  "numpy>=1.26",
  "psutil>=5.9",
  "pyarrow>=15",
  "scikit-learn>=1.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "real: needs llama-server and a GGUF file (set MYRIAD_TEST_GGUF); skipped otherwise",
]
